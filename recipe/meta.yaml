{% set name = "ncdata" %}
{% set version = "0.4.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: de83c69dd78dce75fb1825bbbcdc9b9b1e274af10d5c089fcbc1e9adfc27e09b

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python >=3.7
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=64
    - setuptools-scm >=7
  run:
    - python >={{ python_min }}
    - numpy
    - dask
    - netCDF4

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - ncdata
  commands:
    - pip check

about:
  home: https://github.com/pp-mo/ncdata
  summary: Abstract NetCDF data objects, providing fast data transfer between analysis packages.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://ncdata.readthedocs.io
  dev_url: https://github.com/pp-mo/ncdata"

extra:
  recipe-maintainers:
    - pp-mo
